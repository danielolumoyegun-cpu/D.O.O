<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark green background -->
  <rect width="100" height="100" rx="18" ry="18" fill="#0d120a"/>
  
  <!-- Green circle -->
  <circle cx="50" cy="50" r="46" fill="#1f4a17"/>
  
  <!-- Gold outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#d4a843" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#d4a843" stroke-width="0.5"/>
 
  <!-- D.O.O centered text -->
  <text
    x="50"
    y="58"
    font-family="Georgia, serif"
    font-size="22"
    font-weight="700"
    fill="#d4a843"
    text-anchor="middle"
    dominant-baseline="middle"
  >D.O.O</text>
</svg>
